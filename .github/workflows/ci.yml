name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write # GHCR image pushes

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Lint
        # v7 is required for golangci-lint v2 support (v6 rejects v2 binaries).
        uses: golangci/golangci-lint-action@v7
        with:
          # Pinned explicitly: the action's `latest` resolves to the v1 track
          # (v1.64.8), which rejects the v2 config format. .golangci.yml is a
          # v2 config, so keep this in lockstep with the v2 release used.
          version: v2.12.2

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Build
        run: go build ./...

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Lowercase repository (GHCR requires lowercase names)
        id: repo
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push control plane
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.repo }}:latest, ghcr.io/${{ steps.repo.outputs.repo }}:${{ github.sha }}

      - name: Build and push console
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.repo }}-console:latest, ghcr.io/${{ steps.repo.outputs.repo }}-console:${{ github.sha }}
