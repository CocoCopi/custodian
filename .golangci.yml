version: "2"

run:
  timeout: 5m
  # Pin the analysis Go version to what the prebuilt golangci-lint binary
  # supports (built with Go 1.24), so it never trips over newer go.mod
  # directives (e.g. `go 1.25`).
  go: "1.24"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - misspell
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
