apiVersion: v1
kind: Secret
metadata:
  name: custodian-postgres
  namespace: custodian
type: Opaque
stringData:
  user: custodian
  password: changeme
  db: custodian
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: custodian
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: custodian-postgres, key: user }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: custodian-postgres, key: password }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: custodian-postgres, key: db }
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: custodian
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
