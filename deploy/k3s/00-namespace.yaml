apiVersion: v1
kind: Namespace
metadata:
  name: custodian
  labels:
    custodian.dev/component: control-plane
---
# ClusterIssuer for automatic Let's Encrypt certificates (cert-manager).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
