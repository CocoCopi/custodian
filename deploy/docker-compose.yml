# Custodian control plane — full self-hosted stack.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# Provides: API + worker, PostgreSQL, Redis, Traefik (TLS), MinIO (S3),
# Prometheus, Grafana, Loki and Alertmanager.

name: custodian

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${CUSTODIAN_DB_USER:-custodian}
      POSTGRES_PASSWORD: ${CUSTODIAN_DB_PASSWORD:-custodian}
      POSTGRES_DB: ${CUSTODIAN_DB_NAME:-custodian}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CUSTODIAN_DB_USER:-custodian}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CUSTODIAN_MINIO_USER:-custodian}
      MINIO_ROOT_PASSWORD: ${CUSTODIAN_MINIO_PASSWORD:-custodian123}
    volumes:
      - minio_data:/data
    expose: ["9000", "9001"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.minio.rule: Host(`minio.${CUSTODIAN_DOMAIN:-localhost}`)
      traefik.http.routers.minio.entrypoints: websecure
      traefik.http.routers.minio.tls.certresolver: letsencrypt
      traefik.http.services.minio.loadbalancer.server.port: "9000"
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      CUSTODIAN_ADDR: ":8080"
      CUSTODIAN_PUBLIC_URL: https://${CUSTODIAN_DOMAIN:-localhost}
      CUSTODIAN_DATABASE_URL: postgres://${CUSTODIAN_DB_USER:-custodian}:${CUSTODIAN_DB_PASSWORD:-custodian}@postgres:5432/${CUSTODIAN_DB_NAME:-custodian}?sslmode=disable
      CUSTODIAN_REDIS_ADDR: redis:6379
      CUSTODIAN_JWT_SECRET: ${CUSTODIAN_JWT_SECRET:?set CUSTODIAN_JWT_SECRET in .env}
      CUSTODIAN_ENGINE: ${CUSTODIAN_ENGINE:-compose}
      CUSTODIAN_OIDC_ISSUER: ${CUSTODIAN_OIDC_ISSUER:-}
      CUSTODIAN_OIDC_CLIENT_ID: ${CUSTODIAN_OIDC_CLIENT_ID:-}
      CUSTODIAN_OIDC_CLIENT_SECRET: ${CUSTODIAN_OIDC_CLIENT_SECRET:-}
      CUSTODIAN_OIDC_REDIRECT_URL: ${CUSTODIAN_OIDC_REDIRECT_URL:-}
      CUSTODIAN_DEPLOY_ROOT: /data/deploy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - deploy_data:/data
    expose: ["8080"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: Host(`api.${CUSTODIAN_DOMAIN:-localhost}`)
      traefik.http.routers.api.entrypoints: websecure
      traefik.http.routers.api.tls.certresolver: letsencrypt
      traefik.http.services.api.loadbalancer.server.port: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    command: ["/usr/local/bin/custodian-worker"]
    environment:
      CUSTODIAN_DATABASE_URL: postgres://${CUSTODIAN_DB_USER:-custodian}:${CUSTODIAN_DB_PASSWORD:-custodian}@postgres:5432/${CUSTODIAN_DB_NAME:-custodian}?sslmode=disable
      CUSTODIAN_REDIS_ADDR: redis:6379
      CUSTODIAN_JWT_SECRET: ${CUSTODIAN_JWT_SECRET:?set CUSTODIAN_JWT_SECRET in .env}
      CUSTODIAN_ENGINE: ${CUSTODIAN_ENGINE:-compose}
      CUSTODIAN_DEPLOY_ROOT: /data/deploy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - deploy_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  console:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api.${CUSTODIAN_DOMAIN:-localhost}
    expose: ["80"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.console.rule: Host(`${CUSTODIAN_DOMAIN:-localhost}`)
      traefik.http.routers.console.entrypoints: websecure
      traefik.http.routers.console.tls.certresolver: letsencrypt
      traefik.http.services.console.loadbalancer.server.port: "80"
    depends_on:
      - api
    restart: unless-stopped

  traefik:
    image: traefik:v3.1
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${CUSTODIAN_LETSENCRYPT_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_data:/letsencrypt
    restart: unless-stopped

  # --- Observability ---
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    expose: ["9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${CUSTODIAN_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${CUSTODIAN_GRAFANA_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    expose: ["3000"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: Host(`grafana.${CUSTODIAN_DOMAIN:-localhost}`)
      traefik.http.routers.grafana.entrypoints: websecure
      traefik.http.routers.grafana.tls.certresolver: letsencrypt
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki_data:/loki
    expose: ["3100"]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    expose: ["9093"]
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  minio_data:
  traefik_data:
  prom_data:
  grafana_data:
  loki_data:
  deploy_data:
