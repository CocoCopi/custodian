apiVersion: apps/v1
kind: Deployment
metadata:
  name: custodian-console
  namespace: custodian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: custodian-console
  template:
    metadata:
      labels:
        app: custodian-console
    spec:
      containers:
        - name: console
          image: ghcr.io/cococopi/custodian-console:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: custodian-console
  namespace: custodian
spec:
  selector:
    app: custodian-console
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: custodian-console
  namespace: custodian
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: paas.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: custodian-console
                port: { number: 80 }
  tls:
    - hosts: [paas.example.com]
      secretName: custodian-console-tls
